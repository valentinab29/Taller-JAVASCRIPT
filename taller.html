<!DOCTYPE html> 
<html lang="es"> 
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="taller.css">
<title>Título</title> 
</head>

<body> 

<form id="registro-usuario">
  
    <label for="nombreCompleto">Nombre Completo:</label>
    <input type="text" id="nombreCompleto" name="nombreCompleto" minlength="12" maxlength="50">

  
  
    <label for="edad">Edad:</label>
    <input type="number" id="edad" name="edad" min="0" max="120" step="1">
  

  
  
    <label for="tipoDoc">Tipo de Documento:</label>
    <select id="tipoDoc" name="tipoDoc" required>
      <option value="" disabled selected>Seleccione una opción</option>
      <option value="CC">Cédula de Ciudadanía</option>
      <option value="TI">Tarjeta de Identidad</option>
      <option value="CE">Cédula de Extranjería</option>
      <option value="PAS">Pasaporte</option>
    </select>
  

  
  
    <label for="numeroDoc">Número de Documento (sin puntos ni comas):</label>
    <input type="text" id="numeroDoc" name="numeroDoc" required minlength="9" maxlength="10" >
  
<label for="salario">Salario (sin puntos ni comas):</label>
<input type="number" id="salario" name="salario">

<label for="comisiones">Comisiones:</label>
<input type="number" id="comisiones" name="comisiones">

<label for="horasExtras">Horas Extras:</label>
<input type="number" id="horasExtras" name="horasExtras">

<label for="nivelRiesgo">Nivel de Riesgo:</label>
<select id="nivelRiesgo" name="nivelRiesgo">

<option value="" disabled selected>Seleccione una opción</option>

<option value="1">Nivel 1</option>
<option value="2">Nivel 2</option>
<option value="3">Nivel 3</option>
<option value="4">Nivel 4</option>
<option value="5">Nivel 5</option>

</select>
  
   <input type="button" id="button" name="button" value="Enviar Registro">

   <div id="resultado"></div>

</form>

<script src="TallerVariable.js"></script>

</body>
</html>
