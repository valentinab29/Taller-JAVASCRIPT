<!DOCTYPE html> 
<html lang="es"> 
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Título</title> 
</head>

<body> 
<script src="script.js"></script> 
<form id="registro-usuario">
  
    <label for="nombreCompleto">Nombre Completo:</label>
    <input type="text" id="nombreCompleto" name="nombreCompleto">

  
  
    <label for="edad">Edad:</label>
    <input type="number" id="edad" name="edad" min="0" max="120">
  

  
  
    <label for="tipoDoc">Tipo de Documento:</label>
    <select id="tipoDoc" name="tipoDoc" required>
      <option value="" disabled selected>Seleccione una opción</option>
      <option value="CC">Cédula de Ciudadanía</option>
      <option value="TI">Tarjeta de Identidad</option>
      <option value="CE">Cédula de Extranjería</option>
      <option value="PAS">Pasaporte</option>
    </select>
  

  
  
    <label for="numeroDoc">Número de Documento:</label>
    <input type="text" id="numeroDoc" name="numeroDoc" required>
  

  
  <input type="button">Enviar Registro>
</form>
</body>
</html>
